    <!-- ========================================== -->
    <!-- ADICIÓN: Estilos mínimos para estados de botones -->
    <!-- ========================================== -->
    <style>
      .ascii-btn {
        transition:
          opacity 0.2s ease,
          color 0.2s ease,
          text-decoration 0.2s ease;
      }

      /* Cuando suena: PLAY se subraya y toma el color de acento del sitio */
      .ascii-btn.is-active {
        text-decoration: underline;
        text-underline-offset: 4px;
        color: var(--accent, #d4433a);
        font-weight: 600;
      }

      /* Cuando está detenido: STOP se atenúa y no es clicable */
      .ascii-btn.is-disabled {
        opacity: 0.3;
        cursor: not-allowed;
        text-decoration: none !important;
      }
    </style>
  </head>

          />

        <section class="player" aria-label="Reproductor">
          <!-- El medidor se deja intacto para que radio.js lo controle con Web Audio API -->
          <div id="ascii-meter" class="ascii-meter" aria-live="off">
            [........................]
          </div>

          <div class="ascii-controls">
            <button id="play-btn" class="ascii-btn" type="button">
              [ PLAY ]
            </button>
            <button id="stop-btn" class="ascii-btn" type="button">

              <div>-</div>

        </section>

    <!-- ========================================== -->
    <!-- ADICIÓN: Script de mejora UX (Puramente Reactivo) -->
    <!-- ========================================== -->
    <script>
      (function () {
        document.addEventListener("DOMContentLoaded", function () {
          const playBtn = document.getElementById("play-btn");
          const stopBtn = document.getElementById("stop-btn");
          const audio = document.getElementById("audio");

          if (!playBtn || !stopBtn || !audio) return;

          // Función que solo actualiza las clases visuales de los botones
          function updateButtons() {
            // Verificamos si el audio está sonando y tiene datos cargados
            const isPlaying = !audio.paused && audio.readyState >= 2;

            if (isPlaying) {
              playBtn.classList.add("is-active");
              stopBtn.classList.remove("is-disabled");
              stopBtn.disabled = false;
            } else {
              playBtn.classList.remove("is-active");
              stopBtn.classList.add("is-disabled");
              stopBtn.disabled = true;
            }
          }

          // Nos suscribimos a los eventos que radio.js ya dispara.
          // NO tocamos audio.play() ni audio.pause(), dejamos que radio.js mande.
          audio.addEventListener("play", updateButtons);
          audio.addEventListener("pause", updateButtons);
          audio.addEventListener("waiting", updateButtons);
          audio.addEventListener("error", updateButtons);

          // Aplicamos el estado inicial al cargar la página
          updateButtons();
        });
      })();
    </script>
